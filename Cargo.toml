[workspace]
resolver = "2" # What does this do?
members = [".", "./cli", "./lsp"]
default-members = ["."]
exclude = ["fuzz"]

[package]
name = "lyte"
version = "0.1.0"
authors = ["Taylor Holliday <lyte@audulus.com>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "lyte"
crate-type = ["lib", "staticlib", "cdylib"]

[features]
default = ["cranelift"]
cranelift = ["dep:cranelift", "dep:cranelift-module", "dep:cranelift-jit", "dep:cranelift-codegen", "dep:cranelift-native"]
llvm = ["inkwell"]

[dependencies]
internment = "0.8.6"
superslice = "1.0.0"
cranelift = { version = "0.132.0", optional = true }
cranelift-module = { version = "0.132.0", optional = true }
cranelift-jit = { version = "0.132.0", optional = true }
cranelift-codegen = { version = "0.132.0", optional = true }
cranelift-native = { version = "0.132.0", optional = true }
libc = "0.2.186"
inkwell = { version = "0.9.0", features = ["llvm19-1"], optional = true }

# libffi backs the VM's extern calls (src/vm.rs). On macOS the system libffi is
# used (Apple ships a modern one in the SDK, and lyte needs only ffi_prep_cif
# and ffi_call); elsewhere libffi-sys builds and bundles its own. The bundled
# x86_64 build's hand-written unwind info in unix64.S leaves a 1-byte-aligned
# __compact_unwind section that Apple's linker warns about ("alignment (1) of
# atom ... is too small") in every consumer link, so it is not shipped for
# macOS. iOS keeps the bundled copy: the iOS SDK has no libffi.
[target.'cfg(target_os = "macos")'.dependencies]
libffi = { version = "5.1.0", features = ["system"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
libffi = "5.1.0"

[build-dependencies]
cc = "1.2.62"
